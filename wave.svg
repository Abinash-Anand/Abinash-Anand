<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"></stop>
      <stop offset="50%" stop-color="#8b5cf6"></stop>
      <stop offset="100%" stop-color="#ff00cc"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="180" fill="#050509"></rect>

  <g opacity="0.25">
    <path d="M0 110 Q150 30 300 110 T600 110 T900 110 T1200 110" fill="none" stroke="url(#wave)" stroke-width="2">

      <animate attributeName="d" dur="5s" repeatCount="indefinite" values="
        M0 110 Q150 30 300 110 T600 110 T900 110 T1200 110;
        M0 110 Q150 160 300 110 T600 110 T900 110 T1200 110;
        M0 110 Q150 30 300 110 T600 110 T900 110 T1200 110
        "></animate>

    </path>
  </g>

  <path d="M0 110 Q150 30 300 110 T600 110 T900 110 T1200 110" fill="none" stroke="url(#wave)" stroke-width="3" filter="url(#glow)">

    <animate attributeName="d" dur="5s" repeatCount="indefinite" values="
      M0 110 Q150 30 300 110 T600 110 T900 110 T1200 110;
      M0 110 Q150 160 300 110 T600 110 T900 110 T1200 110;
      M0 110 Q150 30 300 110 T600 110 T900 110 T1200 110
      "></animate>

  </path>

  <g fill="#00f0ff">

    <circle cx="90" cy="90" r="2">
      <animate attributeName="cy" values="90;55;90" dur="2s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="210" cy="120" r="2">
      <animate attributeName="cy" values="120;80;120" dur="2.7s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="390" cy="95" r="2">
      <animate attributeName="cy" values="95;145;95" dur="3s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="520" cy="115" r="2">
      <animate attributeName="cy" values="115;70;115" dur="2.4s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="700" cy="90" r="2">
      <animate attributeName="cy" values="90;135;90" dur="3.2s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="850" cy="115" r="2">
      <animate attributeName="cy" values="115;60;115" dur="2.8s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="1030" cy="90" r="2">
      <animate attributeName="cy" values="90;145;90" dur="2.3s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="1130" cy="110" r="2">
      <animate attributeName="cy" values="110;65;110" dur="3.1s" repeatCount="indefinite"></animate>
    </circle>

  </g>

</svg>